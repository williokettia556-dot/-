<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 60px 20px;
        }

        .card {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 40px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            color: #ff6b35;
        }

        p {
            color: #666;
            line-height: 1.8;
        }

        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>欢迎来到我的网页！</h1>

        <p>
            这是我通过 GitHub 创建的第一个网页。
        </p>

        <p>
            我可以在这里展示产品、分享内容和发布信息。
        </p>

        <button onclick="alert('网页运行成功！')">
            点击体验
        </button>
    </div>

</body>
</html>
